<!doctype html>
<html lang="ca">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css">
    <script src="script.js" type="module" defer></script>
    <title>HOPE QUEST</title>
</head>

<body>
    <header id="header">
        <img class="logo" src="public/assets/placeholder.png">
        <p>HOPE QUEST</p>
    </header>

    <main>
        <section id="menu">
            <div id="menu_options">
                <input class="active" type="button" id="btn_inici" value="INICI">
                <input type="button" id="btn_perfil" value="PERFIL">
                <input type="button" id="btn_ranking" value="RANKING">
                <input type="button" id="btn_informacio" value="INFORMACIÓ">
                <input type="button" id="btn_credits" value="CRÉDITS">
            </div>

            <div id="menu_login">
                <div id="login_screen" class="screen active">
                    <p>Usuari</p>
                    <input id="inp_user" type="text" placeholder="Introdueix usuari...">

                    <p>Contrasenya</p>
                    <input id="inp_passwd" type="password" placeholder="Introdueix contrasenya...">

                    <input type="button" id="btn_login" value="Iniciar sessió">
                    <input type="button" id="btn_signin" value="Crear compte">
                    <p id="message">Aquest usuari ja existeix</p>
                </div>

                <div id="session_screen" class="screen">
                    <img id="session_picture" src="public/assets/profile_pictures/pfp.jpeg">
                    <p id="session_name">playerName</p>
                    <p id="session_points">000 pts</p>

                    <input type="button" id="btn_logout" value="Tancar sessió">
                </div>
            </div>
        </section>

        <div id="container">
            <div id="content" class="panel active">
                <div id="app">
                    <div id="game_container"></div>
                </div>

                <div id="ranking">
                    <div id="ranking_info">
                        <p id="info_ranking">#</p>
                        <p id="info_username">Usuari</p>
                        <p id="info_points">Pts</p>
                    </div>
                </div>
            </div>

            <div id="profile" class="panel">
                <div id="profile_card">
                    <div id="profile_info">
                        <img id="profile_picture" src="public/assets/profile_pictures/pfp.jpeg">

                        <div id="profile_about">
                            <p id="profile_name">playerName</p>
                            <div>
                                <p id="profile_points">000 pts</p>
                                <p id="profile_rank" class="first">(Rank #1)</p>
                            </div>
                        </div>
                    </div>

                    <div id="profile_stats">
                        <p>Insígnies</p>
                        <div id="profile_achievements">
                            <img id="ach_1" src="public/assets/achievements/unknown.png">
                            <img id="ach_2" src="public/assets/achievements/unknown.png">
                            <img id="ach_3" src="public/assets/achievements/unknown.png">
                            <img id="ach_4" src="public/assets/achievements/unknown.png">
                            <img id="ach_5" src="public/assets/achievements/unknown.png">
                        </div>

                        <p>Medalles</p>
                        <div id="profile_medals">
                            <img id="medal_1" src="public/assets/medals/m1_locked.png">
                            <img id="medal_2" src="public/assets/medals/m2_locked.png">
                            <img id="medal_3" src="public/assets/medals/m3_locked.png">
                        </div>
                    </div>
                </div>
            </div>

            <div id="ranking_page" class="panel">
            </div>

            <div id="informacio" class="panel">
            </div>

            <div id="credits" class="panel">
            </div>

            <footer id="footer">
                <p>© 2026 Hope Quest™</p>
            </footer>
        </div>
    </main>

    <script type="module" src="src/main.js"></script>
</body>

</html>
